[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clonaut"
dynamic = ["version"]
description = "Desktop GUI for rclone: remotes, transfers with progress, safety trash, dry runs and scheduled syncs"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Gradia", email = "gradia@disroot.org" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.33"]
keywords = ["rclone", "gui", "qt", "sync", "backup", "cloud-storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Italian",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
]

[project.optional-dependencies]
# il binding Qt non è una dipendenza fissa: le distribuzioni forniscono
# PyQt6 o PySide6 dai loro pacchetti; con pip si sceglie l'extra
pyqt6 = ["PyQt6>=6.5"]
pyside6 = ["PySide6-Essentials>=6.5"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/gradia64/Clonaut"
Issues = "https://github.com/gradia64/Clonaut/issues"
Changelog = "https://github.com/gradia64/Clonaut/blob/main/CHANGELOG.md"

[project.scripts]
clonaut = "clonaut.app:main"

[tool.setuptools]
packages = ["clonaut", "clonaut.ui"]

[tool.setuptools.package-data]
clonaut = ["locale/*.po"]   # cataloghi delle traduzioni (clonaut/i18n.py)

[tool.setuptools.dynamic]
version = { attr = "clonaut.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
