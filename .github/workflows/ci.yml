# CI: a ogni push su main e a ogni pull request.
#
# - test: la suite pytest (Qt offscreen, rclone vero) con entrambi i binding
#   Qt e le versioni di Python che pyproject.toml promette;
# - metadata: metainfo AppStream, voce .desktop, .deb con lintian, sintassi
#   degli script di shell.
#
# Le AppImage non si costruiscono qui (servono ~10 minuti e scaricano ~200 MB):
# le costruisce e collauda release.yml, sui tag o a mano.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# solo lettura: nessun job scrive nel repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # lo stesso rclone incluso nelle AppImage (build-appimage.sh), con lo
  # SHA-256 di downloads.rclone.org: i fatti sull'API rc in AGENTS.md sono
  # verificati su questa versione. Niente prefisso RCLONE_: rclone legge ogni
  # variabile RCLONE_* come opzione (RCLONE_VERSION diventerebbe --version
  # e il rcd dei test non partirebbe)
  CI_RCLONE_VERSION: "1.76.0"
  CI_RCLONE_SHA256: "b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7"

jobs:
  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.qt }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 è il minimo di pyproject.toml, 3.12 quello dell'AppImage,
        # 3.13 quello di Debian 13, 3.14 l'ultimo
        python: ["3.10", "3.12", "3.13", "3.14"]
        qt: [pyqt6, pyside6]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt vuole libEGL e xkbcommon anche offscreen; gpg e git (già presenti)
      # per i test della firma dei tag
      - name: Librerie di sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64 \
            fonts-dejavu-core

      - name: rclone ${{ env.CI_RCLONE_VERSION }}
        run: |
          name="rclone-v${CI_RCLONE_VERSION}-linux-amd64"
          curl -sSfL -o "$RUNNER_TEMP/rclone.zip" \
            "https://downloads.rclone.org/v${CI_RCLONE_VERSION}/${name}.zip"
          echo "${CI_RCLONE_SHA256}  $RUNNER_TEMP/rclone.zip" | sha256sum -c -
          unzip -q -j "$RUNNER_TEMP/rclone.zip" "${name}/rclone" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # entrambi i binding installati: CLONAUT_QT sceglie quello della suite,
      # e test_bindings.py prova comunque l'import con tutti e due
      - name: Pacchetti Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,pyqt6,pyside6]"

      - name: Test
        env:
          CLONAUT_QT: ${{ matrix.qt }}
        run: |
          # Niente pipe verso head: chiudendosi presto manderebbe SIGPIPE (exit 141) a rclone.
          ver="$(rclone version)"   # un rclone che non parte ferma il job qui (bash -e)
          echo "${ver%%$'\n'*}"
          python -m pytest -q -rs

  metadata:
    name: Metadati, .deb e script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Strumenti
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            appstream desktop-file-utils lintian shellcheck

      - name: Metainfo AppStream
        run: appstreamcli validate --no-net packaging/io.github.gradia64.Clonaut.metainfo.xml

      - name: Voce .desktop
        run: desktop-file-validate packaging/io.github.gradia64.Clonaut.desktop

      - name: Pacchetto .deb e lintian
        run: |
          ./build-deb.sh
          lintian --fail-on error,warning build/clonaut_*_all.deb

      # solo gli errori veri (-S error): avvisi e stile restano a chi scrive
      - name: Script di shell
        run: |
          shellcheck -S error build-deb.sh build-appimage.sh run.sh packaging/clonaut \
            packaging/appimage/AppRun packaging/appimage/*.sh \
            packaging/aur/test-in-docker.sh scripts/*.sh
