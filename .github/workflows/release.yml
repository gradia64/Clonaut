# Release: sui tag v*, i pacchetti costruiti dal tag e allegati alla release
# GitHub. Stesso schema di Plico:
#
# - il tag lo firma la sottochiave dei tag della chiave di rilascio
#   (packaging/clonaut-release-key.asc, impronte in scripts/release-keys.sh):
#   qui lo si VERIFICA con scripts/verify-tag.sh, e un tag non firmato o
#   firmato da un'altra chiave ferma tutto. Il PKGBUILD AUR verifica lo stesso
#   tag con validpgpkeys;
# - gli allegati non li firma una chiave nella CI: hanno SHA256SUMS e
#   un'attestazione di provenienza di GitHub, che lega ogni file a questo
#   workflow e al commit del tag. Si verifica con
#   gh attestation verify <file> -R gradia64/Clonaut
#   Così la CI non ha nessun segreto da custodire.
#
# Allegati: clonaut_X.Y.Z_all.deb, Clonaut-X.Y.Z-{x86_64,aarch64}.AppImage
# con i loro .zsync (le informazioni di aggiornamento delle AppImage puntano
# lì), SHA256SUMS. Le note vengono da CHANGELOG.md (scripts/release-notes.sh).
# L'AUR resta a mano (AGENTS.md, punto 6 della checklist).
#
# A mano (workflow_dispatch) costruisce e collauda gli stessi pacchetti dal
# ramo scelto, senza pubblicare niente: per provare il packaging prima di un
# tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read   # solo publish alza i permessi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # una release a metà non si interrompe

jobs:
  verify:
    name: Tag firmato e versione
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # il tag precedente, per il link «Full Changelog»

      - name: Tag annotato e firmato dalla sottochiave dei tag
        run: |
          # checkout può riscrivere il tag come leggero: si riprende l'oggetto
          # tag annotato com'è sul server prima di verificarne la firma
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          scripts/verify-tag.sh "$GITHUB_REF_NAME"

      # __init__.py, metainfo, changelog Debian, PKGBUILD e la sezione del
      # CHANGELOG devono dire tutti la versione del tag
      - name: Il tag corrisponde alla versione del codice
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

  build:
    name: .deb e AppImage
    needs: verify
    # sui tag dopo verify; a mano senza (verify lì è saltato)
    if: >-
      !cancelled()
      && (needs.verify.result == 'success'
          || (github.event_name == 'workflow_dispatch' && needs.verify.result == 'skipped'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # SOURCE_DATE_EPOCH dall'ultimo commit

      # pip per installare pytest accanto all'AppImage (smoke-test.sh); la
      # build usa un suo Python, scaricato e fissato per SHA-256
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # file per appimagetool, binutils per readelf, appstream per validare
      # l'AppDir, lintian per il .deb; per il collaudo le librerie che
      # l'AppImage lascia al sistema (GL, xkbcommon e xkbcommon-x11, estensioni
      # di libxcb, D-Bus, fontconfig) e xvfb per X11
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            appstream binutils file lintian xvfb \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-render0 \
            libxcb-shape0 libxcb-xkb1 libx11-xcb1 libdbus-1-3 libfontconfig1 \
            libglib2.0-0t64 fonts-dejavu-core

      # i download hanno SHA-256 fissati: la cache non cambia il risultato,
      # evita solo di riscaricare ~200 MB
      - uses: actions/cache@v4
        with:
          path: build/appimage/downloads
          key: appimage-downloads-${{ hashFiles('build-appimage.sh', 'packaging/appimage/requirements-*.txt') }}
          restore-keys: appimage-downloads-

      - name: AppImage x86_64
        run: ./build-appimage.sh x86_64

      # costruita senza emulazione (pip --platform); la collauda il job
      # test-aarch64 su una macchina ARM vera
      - name: AppImage aarch64
        run: ./build-appimage.sh aarch64

      # controlli con il Python dell'AppImage, l'intera suite di test con le
      # sue librerie, avvio offscreen e su X11 con il rclone incluso
      - name: Collaudo dell'AppImage x86_64
        run: packaging/appimage/smoke-test.sh dist/Clonaut-*-x86_64.AppImage

      - name: Pacchetto .deb e lintian
        run: |
          ./build-deb.sh
          lintian --fail-on error,warning build/clonaut_*_all.deb

      - name: SHA-256
        run: sha256sum dist/*.AppImage dist/*.zsync build/*.deb | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.AppImage
            dist/*.zsync
            build/clonaut_*_all.deb
          if-no-files-found: error
          retention-days: 14

  distros:
    name: AppImage x86_64 su sei distribuzioni
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: packages

      # Debian 12, Ubuntu 22.04/24.04, Fedora, Arch, openSUSE: solo le
      # librerie di base, Xvfb, niente rclone di sistema
      - name: Distribuzioni in Docker
        run: packaging/appimage/test-distros.sh dist/Clonaut-*-x86_64.AppImage

  test-aarch64:
    name: AppImage aarch64 su ARM
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: packages

      # pip per installare pytest accanto all'AppImage (smoke-test.sh)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dipendenze di sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-render0 \
            libxcb-shape0 libxcb-xkb1 libx11-xcb1 libdbus-1-3 libfontconfig1 \
            libglib2.0-0t64 libsm6 libice6 fonts-dejavu-core

      # su una macchina ARM vera: niente qemu, niente byte magici azzerati
      - name: Collaudo dell'AppImage aarch64
        run: packaging/appimage/smoke-test.sh dist/Clonaut-*-aarch64.AppImage

      # Debian 13, Ubuntu 24.04, Fedora, openSUSE (immagini arm64 native)
      - name: Distribuzioni in Docker
        run: packaging/appimage/test-distros.sh dist/Clonaut-*-aarch64.AppImage

  publish:
    name: Release su GitHub
    needs: [verify, build, distros, test-aarch64]
    # il push del tag (o il rilancio di quel run), non un dispatch: quello è
    # una prova e non pubblica niente
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # l'ultimo punto di controllo prima di pubblicare: con «Required
    # reviewers» nelle impostazioni dell'environment, il job aspetta
    # l'approvazione del maintainer
    environment: release
    permissions:
      contents: write        # creare la release e caricare i file
      id-token: write        # attestazione di provenienza
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # il tag precedente, per il link «Full Changelog»

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages/

      - name: File e SHA256SUMS
        run: |
          mkdir -p release
          cp packages/dist/* packages/build/*.deb release/
          cd release
          sha256sum -- * > SHA256SUMS
          tee -a "$GITHUB_STEP_SUMMARY" < SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb

      - name: Allega alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          scripts/release-notes.sh "$tag" > "$RUNNER_TEMP/note.md"
          # una release già esistente (creata a mano, o un rilancio) resta
          # com'è: si caricano solo i file
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --verify-tag --title "Clonaut ${tag#v}" \
              --notes-file "$RUNNER_TEMP/note.md"
          fi
